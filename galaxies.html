        <img class="cursor-main hidden-cursor" id="cursorDuplicate" src="/images/cursor/cursor.svg" alt="" />
        <img class="cursor-shadow" id="cursorShadow" src="/images/cursor/cursor-shadow.webp" alt="" />

    <script>
        const map = document.getElementById('universeMap');
        const backBtn = document.getElementById('backBtn');
        const hubs = document.querySelectorAll('.hub-node');
        const panels = document.querySelectorAll('.galaxy-panel');

        let activeHub = null;

        /* ── Calculate fly-to-centre offset for the FLIP-style transform ── */
        function setFlyOffset(hub) {
            const rect = hub.getBoundingClientRect();
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const hubX = rect.left + rect.width / 2;
            const hubY = rect.top + rect.height / 2;
            hub.style.setProperty('--fly-x', (cx - hubX) + 'px');
            hub.style.setProperty('--fly-y', (cy - hubY) + 'px');
        }

        /* ── Open hub ─────────────────────────────────────── */
        function openHub(hub) {
            const key = hub.dataset.hub;

            setFlyOffset(hub);

            map.classList.add('is-detail');
            hub.classList.add('is-selected');
            activeHub = hub;

            panels.forEach(p => p.classList.toggle('is-active', p.dataset.hub === key));
        }

        /* ── Close back to overview ───────────────────────── */
        function closeDetail() {
            map.classList.remove('is-detail');
            if (activeHub) activeHub.classList.remove('is-selected');
            activeHub = null;
            panels.forEach(p => p.classList.remove('is-active'));
        }

        /* ── Listeners ────────────────────────────────────── */
        hubs.forEach(hub => hub.addEventListener('click', () => openHub(hub)));
        backBtn.addEventListener('click', closeDetail);

        /* Keep fly-offset accurate on resize (if currently open) */
        window.addEventListener('resize', () => {
            if (activeHub) setFlyOffset(activeHub);
        }, { passive: true });
    </script>
