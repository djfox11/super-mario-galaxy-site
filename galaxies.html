<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxies | Super Mario Galaxy</title>
    <style>
        html,
        body {
            background: #02030a;
        }
    </style>
    <link rel="preload" as="image" href="/images/galaxies/hub/terrace-bg.png" fetchpriority="high">
    <link rel="stylesheet" href="/css/galaxies.css">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/cursor.css">
</head>

<body>

    <a class="aqua-button" href="/index.html">
        <span class="aqua-button__body">
            <img class="aqua-icon aqua-icon--left" src="../images/icons/back-icon.svg" alt="">
            <img class="aqua-icon aqua-icon--middle" src="../images/icons/button-icon.svg" alt="">
            <span class="aqua-button__text">Back</span>
        </span>
    </a>

    <nav class="hub-switcher" id="hubSwitcher" aria-label="Hub selection"></nav>

    <main class="page" id="hubPage">
        <div class="galaxy-list" id="galaxyList" aria-label="Galaxy cards"></div>
    </main>

    <div class="cursor-container" id="cursorContainer">
        <img class="cursor-main" id="cursorMain" src="/images/cursor/cursor.svg" alt="" />
        <img class="cursor-main hidden-cursor" id="cursorDuplicate" src="/images/cursor/cursor.svg" alt="" />
        <img class="cursor-shadow" id="cursorShadow" src="/images/cursor/cursor-shadow.webp" alt="" />
    </div>

    <script src="/js/galaxies.js"></script>
    <script src="/js/cursor.js"></script>
</body>

</html>
