        const iconPaths = {
            grandstar: "/images/ui/grandstar.png",
            powerstar: "/images/ui/powerstar.png",
            prankstercomet: "/images/ui/prankstercomet.png",
            greencomet: "/images/ui/greencomet.png",
            cometMedal: "/images/ui/cometmedal.png"
        };

        const iconLabels = {
            grandstar: "Grand Star",
            powerstar: "Power Star",
            prankstercomet: "Prankster Comet",
            greencomet: "Green Comet",
            cometMedal: "Comet Medal"
        };

        const leftIconPriority = [
            "grandstar",
            "powerstar",
            "prankstercomet",
            "greencomet"
        ];

        const map = document.getElementById('universeMap');
        const backBtn = document.getElementById('backBtn');
        const hubs = document.querySelectorAll('.hub-node');
        const galaxyPanel = document.getElementById('galaxyPanel');
        const galaxyList = document.getElementById('galaxyList');

        let activeHub = null;

        /* Calculate fly-to-header offset for the FLIP-style transform. */
        function setFlyOffset(hub) {
            const rect = hub.getBoundingClientRect();
            const cx = window.innerWidth / 2;
            const cy = window.matchMedia('(max-width: 768px)').matches ? 96 : 118;
            const hubX = rect.left + rect.width / 2;
            const hubY = rect.top + rect.height / 2;
            hub.style.setProperty('--fly-x', (cx - hubX) + 'px');
            hub.style.setProperty('--fly-y', (cy - hubY) + 'px');
        }

        function renderGalaxies(items) {
            galaxyList.innerHTML = "";

            for (const galaxy of items) {
                const card = document.createElement("a");
                card.className = "galaxy-card";
                card.href = galaxy.href;
                card.setAttribute("aria-label", `${galaxy.title}: ${getIconSummary(galaxy.icons)}`);

                card.innerHTML = `
                    <div class="galaxy-divider" aria-hidden="true"></div>

                    <div class="galaxy-art" aria-hidden="true">
                        <img src="${galaxy.image}" alt="">
                    </div>

                    <div class="galaxy-content">
                        <h2 class="galaxy-title">${escapeHtml(galaxy.title)}</h2>

                        <div class="galaxy-icons" aria-hidden="true">
                            ${renderLeftIcons(galaxy.icons)}
                        </div>
                    </div>

                    ${renderCometMedalBadge(galaxy.icons)}
                `;

                galaxyList.appendChild(card);
            }
        }

        function renderLeftIcons(icons) {
            let html = "";

            for (const iconType of leftIconPriority) {
                const matchingIcons = icons.filter(icon => icon === iconType);

                for (const icon of matchingIcons) {
                    html += imageIcon(icon);
                }
            }

            return html;
        }

        function renderCometMedalBadge(icons) {
            if (!icons.includes("cometMedal")) return "";

            return `
                <div class="collectible-badge" aria-label="Comet Medal">
                    <img src="${iconPaths.cometMedal}" alt="">
                </div>
            `;
        }

        function imageIcon(iconType) {
            const src = iconPaths[iconType];
            const label = iconLabels[iconType];

            if (!src || !label) {
                console.warn(`Unknown icon type: ${iconType}`);
                return "";
            }

            return `
                <img
                    class="icon"
                    src="${src}"
                    alt="${label}"
                    draggable="false"
                >
            `;
        }

        function getIconSummary(icons) {
            const counts = {};

            for (const icon of icons) {
                counts[icon] = (counts[icon] || 0) + 1;
            }

            return Object.entries(counts)
                .map(([icon, count]) => {
                    const label = iconLabels[icon] || icon;
                    return count === 1 ? label : `${count} ${label}s`;
                })
                .join(", ");
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function openHub(hub) {
            const key = hub.dataset.hub;
            const galaxies = galaxyData[key] || [];

            setFlyOffset(hub);
            renderGalaxies(galaxies);

            map.classList.add('is-detail');
            map.dataset.activeHub = key;
            hub.classList.add('is-selected');
            galaxyPanel.classList.add('is-active');
            activeHub = hub;
        }

        function closeDetail() {
            map.classList.remove('is-detail');
            delete map.dataset.activeHub;
            if (activeHub) activeHub.classList.remove('is-selected');
            activeHub = null;
            galaxyPanel.classList.remove('is-active');
        }

        hubs.forEach(hub => hub.addEventListener('click', () => openHub(hub)));
        backBtn.addEventListener('click', closeDetail);

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') closeDetail();
        });

        window.addEventListener('resize', () => {
            if (activeHub) setFlyOffset(activeHub);
        }, { passive: true });
