<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore the story, characters, galaxies, power-ups, enemies and music of Super Mario Galaxy.">
    <title>Super Mario Galaxy | Universe Guide</title>

    <link rel="preload" as="image" href="/images/general/smg-outer-space-bg.png" fetchpriority="high">
    <link rel="preload" as="image" href="/images/general/smg-logo.png">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/cursor.css">
</head>

<body class="home-page">
    <header class="mission-header">
        <div class="site-brand" aria-label="Super Mario Galaxy Universe Guide">
            <img src="/images/general/smg-logo.png" alt="Super Mario Galaxy">
        </div>

        <div class="mission-heading">
            <p>Comet Observatory Archive</p>
            <h1>Select a destination</h1>
        </div>
    </header>

    <main class="destination-stage">
        <div class="orbit orbit--outer" aria-hidden="true"></div>
        <div class="orbit orbit--inner" aria-hidden="true"></div>

        <div class="stage-art" aria-hidden="true">
            <img src="/images/ui/grandstar.png" alt="" draggable="false">
        </div>

        <nav class="destination-list" aria-label="Explore the universe guide">
            <a class="destination-card destination-card--featured" href="/galaxies.html" data-destination>
                <span class="destination-card__media">
                    <img src="/images/galaxies/hub/terrace.png" alt="" draggable="false">
                </span>
                <span class="destination-card__copy">
                    <strong>Galaxies</strong>
                    <small>Explore the universe</small>
                </span>
            </a>

            <a class="destination-card" href="/story.html" data-destination>
                <span class="destination-card__media">
                    <img src="/images/ui/grandstar.png" alt="" draggable="false">
                </span>
                <strong>Story</strong>
            </a>

            <a class="destination-card" href="/characters.html" data-destination>
                <span class="destination-card__media">
                    <img src="/images/characters/bosses/bowser.png" alt="" draggable="false">
                </span>
                <strong>Characters</strong>
            </a>

            <a class="destination-card" href="/power-ups.html" data-destination>
                <span class="destination-card__media">
                    <img src="/images/ui/redstar.png" alt="" draggable="false">
                </span>
                <strong>Power-Ups</strong>
            </a>

            <a class="destination-card" href="/enemies.html" data-destination>
                <span class="destination-card__media">
                    <img src="/images/characters/enemies/chomp.png" alt="" draggable="false">
                </span>
                <strong>Enemies</strong>
            </a>

            <a class="destination-card" href="/soundtrack.html" data-destination>
                <span class="destination-card__media">
                    <img src="/images/ui/greencomet.png" alt="" draggable="false">
                </span>
                <strong>Soundtrack</strong>
            </a>
        </nav>
    </main>

    <footer class="mission-footer">
        <div class="mission-footer__inner">
            <nav class="utility-links" aria-label="Project links">
                <a href="/about.html"><span aria-hidden="true">★</span> About</a>
                <span class="utility-links__divider" aria-hidden="true"></span>
                <a href="/contact.html"><span aria-hidden="true">✉</span> Contact</a>
            </nav>
            <p>Unofficial fan-made universe guide</p>
        </div>
    </footer>

    <div class="cursor-container" id="cursorContainer" aria-hidden="true">
        <img class="cursor-main" id="cursorMain" src="/images/cursor/cursor.svg" alt="">
        <img class="cursor-main hidden-cursor" id="cursorDuplicate" src="/images/cursor/cursor.svg" alt="">
        <img class="cursor-shadow" id="cursorShadow" src="/images/cursor/cursor-shadow.webp" alt="">
    </div>

    <script src="/js/home.js"></script>
    <script src="/js/cursor.js"></script>
</body>

</html>
